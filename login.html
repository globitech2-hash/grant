<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title data-i18n="auth.loginTitle">Sign in – Grant Wallet</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
  <header class="auth-topbar" id="auth-topbar"></header>

  <main class="auth-main">
    <div class="auth-card card">
      <h1 class="page-title" data-i18n="auth.loginTitle">Sign in</h1>
      <p class="page-subtitle" data-i18n="auth.loginSubtitle">Access your grant wallet.</p>

      <form id="login-form" class="auth-form" novalidate autocomplete="on">
        <div class="field">
          <label for="email" data-i18n="auth.email">Email address</label>
          <input id="email" name="email" type="email" class="input" autocomplete="username" inputmode="email" spellcheck="false" required>
          <p class="field-error" id="email-error" hidden></p>
        </div>

        <div class="field">
          <label for="password" data-i18n="auth.password">Password</label>
          <div class="input-group">
            <input id="password" name="password" type="password" class="input" autocomplete="current-password" required>
            <button type="button" class="input-action" id="toggle-password" aria-label="Show password" data-i18n-aria="auth.showPassword" aria-pressed="false">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field-error" id="password-error" hidden></p>
        </div>

        <div class="form-alert alert-error" id="form-error" role="alert" hidden></div>

        <button class="btn btn-primary btn-block" type="submit" id="login-submit">
          <span data-i18n="auth.signIn">Sign in</span>
        </button>
      </form>

      <p class="auth-foot">
        <span data-i18n="auth.noAccount">Don't have an account?</span>
        <a class="link" href="register.html" data-i18n="auth.register">Register</a>
      </p>
    </div>
  </main>

  <p class="auth-footer-note" data-i18n="auth.footer">Secure access to grant disbursements</p>

  <script src="js/translations.js"></script>
  <script src="js/translator.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
