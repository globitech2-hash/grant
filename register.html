<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title data-i18n="auth.registerTitle">Create account – Grant Wallet</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
  <header class="auth-topbar" id="auth-topbar"></header>

  <main class="auth-main">
    <div class="auth-card card region-card">
      <div class="empty">
        <img src="assets/icons/globe-off.svg" alt="" width="36" height="36">
        <h1 class="empty-title" data-i18n="auth.regionTitle">Not available in your region</h1>
        <p class="empty-text" data-i18n="auth.regionMessage">Account registration is currently not offered in your region. If you already have an account, you can sign in.</p>
        <a class="btn btn-primary" href="login.html">
          <span data-i18n="auth.backToLogin">Back to sign in</span>
        </a>
      </div>
    </div>
  </main>

  <p class="auth-footer-note" data-i18n="auth.footer">Secure access to grant disbursements</p>

  <script src="js/translations.js"></script>
  <script src="js/translator.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
